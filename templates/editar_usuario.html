{% extends 'base.html' %}{% block titulo %}Editar perfil{% endblock %}{% block contenido %}
<a href="{{ url_for('fdu.usuarios') }}">← Volver</a><h1>Editar mi perfil</h1>
<form class="card card-fdu p-4 row g-3" method="POST"><input type="hidden" name="_csrf" value="{{ fdu_csrf() }}">
<div class="col-md-6"><label class="form-label">Nombre</label><input class="form-control" name="nombre" value="{{ usuario.nombre }}" required></div>
<div class="col-md-6"><label class="form-label">Apellidos</label><input class="form-control" name="apellidos" value="{{ usuario.apellidos }}" required></div>
<div class="col-12"><label class="form-label">Nueva contraseña (opcional)</label><input class="form-control" type="password" name="contrasena" minlength="8"></div>
<div><button class="btn btn-fdu">Guardar cambios</button></div></form>{% endblock %}
