
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión | Sistema FDU</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Nuestro CSS -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/login.css') }}"
    >
</head>

<body>

    <main class="container">
        <div class="card login-card shadow-lg mx-auto">

            <div class="card-body p-4 p-md-5">

                <div class="text-center mb-4">
                    <h2 class="fw-bold">Sistema FDU</h2>
                    <p class="text-muted">
                        Gestión de fondos de desarrollo
                    </p>
                </div>

                <!-- Mensajes enviados desde Flask -->
                {% with mensajes = get_flashed_messages(with_categories=true) %}
                    {% for categoria, mensaje in mensajes %}
                        <div class="alert alert-{{ categoria }}" role="alert">
                            {{ mensaje }}
                        </div>
                    {% endfor %}
                {% endwith %}

                <!-- Formulario de inicio de sesión -->
                <form action="{{ url_for('login') }}" method="POST">

                    <div class="mb-3">
                        <label for="correo" class="form-label">
                            Correo electrónico
                        </label>

                        <input
                            type="email"
                            class="form-control"
                            id="correo"
                            name="correo"
                            placeholder="ejemplo@correo.com"
                            autocomplete="username"
                            required
                        >
                    </div>

                    <div class="mb-4">
                        <label for="contrasena" class="form-label">
                            Contraseña
                        </label>

                        <input
                            type="password"
                            class="form-control"
                            id="contrasena"
                            name="contrasena"
                            placeholder="Ingresá tu contraseña"
                            autocomplete="current-password"
                            required
                        >
                    </div>

                    <button
                        type="submit"
                        class="btn btn-fdu w-100 py-2"
                    >
                        Iniciar sesión
                    </button>

                </form>

            </div>
        </div>
    </main>

</body>
</html>
