{% extends 'base.html' %}{% block titulo %}Nuevo usuario | Sistema FDU{% endblock %}{% block contenido %}
<div class="mb-4"><a href="{{ url_for('fdu.usuarios') }}" class="link-secondary">← Volver a usuarios</a><h1 class="mt-3">Registrar usuario</h1></div>
<div class="card card-fdu"><div class="card-body p-4"><form method="POST" class="row g-3"><input type="hidden" name="_csrf" value="{{ fdu_csrf() }}">
<div class="col-md-6"><label class="form-label">Identificación</label><input name="identificacion" class="form-control" maxlength="20" required></div>
<div class="col-md-6"><label class="form-label">Teléfono</label><input name="telefono" class="form-control" maxlength="20" required></div>
<div class="col-md-6"><label class="form-label">Nombre</label><input name="nombre" class="form-control" maxlength="80" required></div>
<div class="col-md-6"><label class="form-label">Apellidos</label><input name="apellidos" class="form-control" maxlength="100" required></div>
<div class="col-md-6"><label class="form-label">Correo</label><input name="correo" type="email" class="form-control" maxlength="150" required></div>
<div class="col-md-6"><label class="form-label">Contraseña (mínimo 8 caracteres)</label><input name="contrasena" type="password" class="form-control" minlength="8" required></div>
<div class="col-12"><label class="form-label">Rol</label><select name="rol_id" class="form-select" required><option value="">Seleccionar...</option>{% for r in roles %}<option value="{{ r.id }}">{{ r.nombre }}</option>{% endfor %}</select></div>
<div class="col-12"><button class="btn btn-fdu">Guardar usuario</button></div></form></div></div>
{% endblock %}
